name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: product-map · typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/NextJS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/NextJS/package-lock.json

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 compiles against the image toolchain on ubuntu-latest.
      # Unit tests/typecheck/lint/build stay offline — no Bungie secrets required.
      - name: Product map (validate · generate · dirty · check)
        run: npm run product-map:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan committed files for secrets
        run: gitleaks detect --no-git --redact --source . --exit-code 1
