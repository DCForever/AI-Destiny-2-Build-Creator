name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: product-map · typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/NextJS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/NextJS/package-lock.json

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 compiles against the image toolchain on ubuntu-latest.
      # Unit tests/typecheck/lint/build stay offline — no Bungie secrets required.
      - name: Product map (validate · generate · dirty · check)
        run: npm run product-map:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  flutter-test:
    name: flutter · dart test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No .fvm pin in repo — pin matches cloud agent Flutter (measured 3.44.9 stable).
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      # Drift/sqlite3 FFI needs system SQLite on Linux flutter_tester.
      - name: Install libsqlite3-dev
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev
        working-directory: .

      - name: Flutter pub get
        run: flutter pub get

      # Package-local cwd so package assets resolve (ui_flutter bungie icons).
      - name: Dart package tests
        run: |
          set -euo pipefail
          for pkg in \
            packages/domain \
            packages/sandbox_data \
            packages/storage \
            packages/db \
            packages/manifest \
            packages/bungie \
            packages/app \
            packages/ui_tokens
          do
            echo "=== dart test $pkg ==="
            (cd "$pkg" && dart test)
          done

      - name: Flutter ui_flutter tests
        working-directory: flutter/packages/ui_flutter
        run: |
          set -euo pipefail
          # entity_info_capture_* hangs writing dual-truth PNGs (measured 10m+
          # timeout on desktop-info-desc-present). Gate widget tests only.
          mapfile -t files < <(find test -name '*.dart' ! -name '*capture*' | sort)
          flutter test "${files[@]}"

      # windows_host: 20 pre-existing failures on main (UI key/chrome drift).
      # Listed in PR body — not gated here until genuine fixes land. Do not
      # skip/delete those tests; a follow-up should add:
      #   working-directory: flutter/apps/windows_host
      #   run: flutter test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan committed files for secrets
        run: gitleaks detect --no-git --redact --source . --exit-code 1
