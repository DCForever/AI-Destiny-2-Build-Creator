name: destiny2_domain
description: >
  Pure domain library for Destiny 2 Build Creator multiplatform port.
  Zero IO/UI dependencies. Models (DART-002) and hard evaluators (DART-003);
  soft/resolve/equip land in later DART slices.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.5.0

# Runtime dependencies: Dart SDK only.
# Do NOT add Flutter, Jaspr, Drift, http, path_provider, or other IO/UI packages.
dependencies: {}

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
