name: destiny2_bungie
description: >
  Shared Bungie Platform HTTP client for the multiplatform port (DART-021).
  Public API key header, envelope parse, typed errors, rate-limit hooks.
  Host-injected API key only — no CLIENT_SECRET.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.5.0

# Not a pure-domain package: dart:io default transport + crypto for PKCE S256.
dependencies:
  crypto: ^3.0.6

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
