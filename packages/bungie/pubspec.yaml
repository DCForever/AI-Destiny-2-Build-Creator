name: destiny2_bungie
description: >
  Shared Bungie Platform HTTP client for the multiplatform port (DART-021).
  Public API key header, envelope parse, typed errors, rate-limit hooks.
  Host-injected API key only — no CLIENT_SECRET.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.5.0

# SDK-only runtime (dart:io for default transport). Not a pure-domain package.
dependencies: {}

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
