name: destiny2_widgetbook
description: >
  Isolated Widgetbook catalog for Matte Flap / Neon composables
  (destiny2_ui_flutter). Not a product host — no OAuth, inventory, or secrets.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  destiny2_db:
    path: ../../packages/db
  destiny2_manifest:
    path: ../../packages/manifest
  destiny2_ui_flutter:
    path: ../../packages/ui_flutter
  destiny2_ui_tokens:
    path: ../../packages/ui_tokens
  widgetbook: ^3.20.0
  widgetbook_annotation: ^3.9.0
  # Runtime import gated in main_mcp.dart for MCP screenshots.
  flutter_driver:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  widgetbook_generator: ^3.20.0

flutter:
  uses-material-design: true
