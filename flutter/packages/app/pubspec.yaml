name: destiny2_app
description: >
  In-process application use cases for Destiny 2 Build Creator multiplatform
  port (DART-027+). Orchestrates destiny2_db repositories with pure
  destiny2_domain validation. Optimizer isolate runner + confirm-only
  materialize/apply (DART-035). No HTTP, Flutter, or CLIENT_SECRET.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.5.0

dependencies:
  destiny2_bungie:
    path: ../bungie
  destiny2_db:
    path: ../db
  destiny2_domain:
    path: ../domain
  destiny2_manifest:
    path: ../manifest
  destiny2_sandbox_data:
    path: ../sandbox_data
  drift: any

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
