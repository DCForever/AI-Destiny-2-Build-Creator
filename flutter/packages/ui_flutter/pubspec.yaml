name: destiny2_ui_flutter
description: >
  Flutter-only Matte Flap Ledger composition kit (ThemeExtension, board
  primitives, tone/element helpers). Depends on destiny2_ui_tokens; never
  imported by Jaspr web_host.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  destiny2_db:
    path: ../db
  destiny2_manifest:
    path: ../manifest
  destiny2_ui_tokens:
    path: ../ui_tokens
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/destiny-icons/weapons/
