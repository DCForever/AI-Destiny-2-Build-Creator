<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Catalog · Weapon details — Mobile mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05050f;
      --surface: #0a0a18;
      --raised: #101028;
      --line: rgba(232, 238, 242, 0.22);
      --line-strong: rgba(232, 238, 242, 0.38);
      --fg: #f0fdff;
      --muted: #7dd3e0;
      --muted-dim: rgba(125, 211, 224, 0.45);
      --accent: #00e5ff;
      --accent-wash: rgba(0, 229, 255, 0.14);
      --danger: #ff003c;
      --success: #2ee6a6;
      --warn: #f5c542;
      --el-kinetic: #ffffff;
      --el-arc: #85c5ec;
      --el-solar: #f2721b;
      --el-void: #8b7cf0;
      --el-void-deep: #2a1f5c;
      --el-stasis: #4d88ff;
      --el-strand: #35e366;
      --rarity-exotic: #ceae33;
      --rarity-legendary: #4a2458;
      --rarity-legendary-edge: #c49ad4;
      --ammo-special: #6fdc8c;
      --ammo-heavy: #f0a020;
      --ammo-heavy-hot: #ffc14d;
      --slot-power: #d4b06a;
      --font-d: "Orbitron", system-ui, sans-serif;
      --font-b: "Inter", system-ui, sans-serif;
      --font-m: "JetBrains Mono", ui-monospace, monospace;
      --radius: 2px;
      --nav-h: 52px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --phone-w: 390px;
      --phone-h: 780px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #030308;
      color: var(--fg);
      font-family: var(--font-b);
      font-size: 13px;
      line-height: 1.35;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: transparent; padding: 0; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .mock-bar {
      flex: 0 0 auto;
      width: 100%;
      max-width: 430px;
      padding: 8px 10px;
      background: #080812;
      border-bottom: 1px solid var(--line-strong);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mock-bar h1 {
      margin: 0;
      font-family: var(--font-d);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .mock-bar .meta {
      font-family: var(--font-m);
      font-size: 9px;
      color: var(--muted-dim);
    }
    .scenario-select {
      width: 100%;
      height: 32px;
      padding: 0 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font-m);
      font-size: 11px;
    }
    .auth-row { display: flex; gap: 6px; }
    .auth-row button {
      flex: 1;
      height: 28px;
      font-family: var(--font-d);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .auth-row button[aria-pressed="true"] {
      color: var(--fg);
      background: var(--accent-wash);
      border-color: rgba(0, 229, 255, 0.4);
    }

    .phone {
      flex: 1;
      min-height: 0;
      width: min(100%, var(--phone-w));
      max-height: min(100vh - 140px, var(--phone-h));
      margin: 8px auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .topbar {
      flex: 0 0 auto;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .topbar .back {
      width: 36px; height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--accent);
      border-radius: var(--radius);
    }
    .topbar .back[hidden] { display: none !important; }
    .topbar .title {
      flex: 1;
      min-width: 0;
      font-family: var(--font-d);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-m);
      font-size: 9px;
      color: var(--muted);
    }
    .lamp {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }
    .lamp.off { background: var(--muted-dim); box-shadow: none; }
    .lamp.warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
    .lamp.danger { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

    .defer-banner {
      flex: 0 0 auto;
      padding: 6px 10px;
      font-size: 10px;
      line-height: 1.35;
      color: var(--muted);
      background: rgba(245, 197, 66, 0.06);
      border-bottom: 1px solid rgba(245, 197, 66, 0.2);
      font-family: var(--font-m);
    }
    .defer-banner strong { color: var(--warn); font-weight: 500; }

    .pane-stack {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .pane {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transition: transform 0.22s ease;
    }
    .pane-list { z-index: 1; }
    .pane-detail {
      z-index: 2;
      transform: translateX(100%);
    }
    .phone.detail-open .pane-detail { transform: translateX(0); }
    .phone.detail-open .pane-list { transform: translateX(-18%); }

    .list-chrome {
      flex: 0 0 auto;
      padding: 8px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scope-search { display: flex; gap: 6px; }
    .scope-seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      height: 34px;
      flex-shrink: 0;
    }
    .scope-seg button {
      padding: 0 10px;
      font-family: var(--font-d);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-right: 1px solid var(--line);
    }
    .scope-seg button:last-child { border-right: 0; }
    .scope-seg button[aria-pressed="true"] {
      color: var(--fg);
      background: var(--accent-wash);
      box-shadow: inset 0 -1px 0 var(--accent);
    }
    .search-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 10px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .search-wrap .icon { color: var(--muted-dim); }
    .search-wrap input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      outline: none;
      font-size: 13px;
    }
    .facets-scroll {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .chip {
      height: 30px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--muted);
      font-size: 11px;
      flex-shrink: 0;
    }
    .chip.icon-only { width: 30px; padding: 0; justify-content: center; }
    .chip[data-state="include"] {
      color: var(--fg);
      background: var(--accent-wash);
      border-color: rgba(0, 229, 255, 0.4);
    }
    .chip[data-state="exclude"] {
      color: var(--warn);
      border-color: rgba(245, 197, 66, 0.45);
      background: rgba(245, 197, 66, 0.08);
    }
    .chip .chip-mark {
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--accent);
    }
    .chip[data-state="exclude"] .chip-mark { color: var(--warn); }
    .el-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
    }
    .glyph-ico { font-size: 11px; }
    .glyph-ico.exotic { color: var(--rarity-exotic); }
    .facet-img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }
    .chip.icon-only .facet-img { width: 18px; height: 18px; }
    .type-ico {
      display: block;
      width: 26px;
      height: 12px;
      flex-shrink: 0;
      background: currentColor;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }
    .chip.icon-only .type-ico { width: 28px; height: 12px; }
    .card-type-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .card-type-row .type-ico {
      width: 32px;
      height: 12px;
      color: var(--muted);
      opacity: 0.9;
    }
    .hero-type-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }
    .hero-type-row .type-ico {
      width: 40px;
      height: 14px;
      color: var(--muted);
    }
    .meta-icons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }
    .meta-icons .facet-img {
      width: 16px;
      height: 16px;
    }
    .meta-icons .type-ico {
      width: 34px;
      height: 12px;
      color: var(--muted);
    }
    .meta-icons .slot-letter {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-m);
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 1px;
      background: var(--raised);
    }
    .meta-icons .slot-letter.power { color: var(--slot-power); }
    .meta-icons .slot-letter.energy { color: var(--el-solar); }
    .pill.owned { color: var(--success); border-color: rgba(46, 230, 166, 0.35); }
    .reset-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .reset-btn {
      height: 28px;
      padding: 0 10px;
      font-family: var(--font-d);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--danger);
      border: 1px solid rgba(255, 0, 60, 0.4);
      border-radius: var(--radius);
    }
    .reset-btn[hidden] { display: none !important; }
    .count-label {
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--muted);
    }
    .count-label strong { color: var(--fg); font-weight: 500; }

    .board {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      align-content: start;
      -webkit-overflow-scrolling: touch;
    }

    .weapon-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 108px;
      padding: 8px;
      text-align: left;
      border: 1px solid rgba(232, 238, 242, 0.12);
      border-radius: var(--radius);
      background: rgba(10, 10, 24, 0.88);
      overflow: hidden;
    }
    .weapon-card:active { border-color: rgba(0, 229, 255, 0.35); }
    .weapon-card.rarity-exotic {
      background-image: linear-gradient(270deg, rgba(206,174,51,0.22) 0%, rgba(206,174,51,0.10) 30%, transparent 62%);
    }
    .weapon-card.rarity-legendary {
      background-image: linear-gradient(
        270deg,
        color-mix(in srgb, var(--rarity-legendary-edge) 22%, transparent) 0%,
        color-mix(in srgb, var(--rarity-legendary) 28%, transparent) 28%,
        transparent 58%
      );
    }
    .weapon-card .el-bloom {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 92% 88% at 0% 100%,
        color-mix(in srgb, var(--el) 70%, transparent) 0%,
        color-mix(in srgb, var(--el) 18%, transparent) 42%,
        transparent 78%
      );
      z-index: 0;
    }
    .weapon-card .el-glyph {
      position: absolute;
      left: 5px; bottom: 5px;
      width: 18px; height: 18px;
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #05050f;
      background: radial-gradient(circle at 35% 30%, #fff 0%, var(--el) 42%, color-mix(in srgb, var(--el) 50%, #000) 100%);
    }
    .weapon-card .el-glyph.void {
      background: radial-gradient(circle at 35% 30%, #e4e0ff 0%, var(--el-void) 46%, var(--el-void-deep) 100%);
      color: #f4f2ff;
    }
    .weapon-card .el-glyph.kinetic {
      background: radial-gradient(circle at 35% 30%, #fff 0%, #d0d0d0 55%, #666 100%);
      color: #1a1a1a;
    }
    .weapon-card > .card-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-top { display: flex; gap: 6px; align-items: flex-start; }
    .entity-icon {
      width: 26px; height: 26px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 12px;
    }
    .entity-icon.placeholder { color: var(--muted-dim); font-family: var(--font-m); font-size: 10px; }
    .card-text { flex: 1; min-width: 0; }
    .rarity-badge {
      float: right;
      width: 14px; height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font-m);
      font-size: 8px;
      color: var(--muted);
    }
    .rarity-badge.exotic { color: var(--rarity-exotic); border-color: rgba(206, 174, 51, 0.55); }
    .rarity-badge.legendary {
      color: var(--rarity-legendary-edge);
      border-color: color-mix(in srgb, var(--rarity-legendary-edge) 55%, transparent);
    }
    .card-name {
      font-family: var(--font-d);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .weapon-card.rarity-exotic .card-name { color: var(--rarity-exotic); }
    .card-type { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .card-foot {
      margin-top: auto;
      padding-top: 6px;
      padding-left: 24px;
      border-top: 1px solid rgba(232, 238, 242, 0.12);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .meta-glyphs { display: inline-flex; gap: 3px; flex: 1; }
    .meta-ico {
      width: 15px; height: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--bg);
      font-size: 8px;
      color: var(--muted);
    }
    .meta-ico.ammo-primary { color: #e8e8e8; }
    .meta-ico.ammo-special { color: var(--ammo-special); }
    .meta-ico.ammo-heavy { color: var(--ammo-heavy-hot); }
    .meta-ico.slot-k { color: #e8e8e8; }
    .meta-ico.slot-e { color: var(--el-solar); }
    .meta-ico.slot-p { color: var(--slot-power); }
    .owned-count {
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--accent);
    }

    .skel-card {
      min-height: 108px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 8px;
    }
    .skel-line {
      height: 8px;
      margin-bottom: 8px;
      border-radius: 1px;
      background: linear-gradient(90deg, var(--raised), rgba(16,16,40,0.4), var(--raised));
      background-size: 200% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .state-panel {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 12px;
      min-height: 220px;
    }
    .state-card {
      text-align: center;
      padding: 20px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      max-width: 320px;
    }
    .state-card .kicker {
      font-family: var(--font-d);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted-dim);
      margin-bottom: 6px;
    }
    .state-card h2 {
      margin: 0 0 8px;
      font-family: var(--font-d);
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .state-card p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .state-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    /* Detail pane — same body stack as desktop, full-screen push */
    .detail-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .detail-header {
      padding: 12px 14px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 3;
    }
    .header-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .header-icon {
      width: 44px; height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 20px;
    }
    .header-stack { flex: 1; min-width: 0; }
    .hero-name {
      margin: 0;
      font-family: var(--font-d);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.25;
    }
    .hero-name.exotic { color: var(--rarity-exotic); }
    .hero-type { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .meta-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .pill {
      height: 20px;
      padding: 0 7px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font-m);
      font-size: 10px;
      background: var(--raised);
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; }
    .synergy-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }
    .synergy-chip {
      height: 22px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      pointer-events: none;
    }
    .synergy-chip .tag {
      font-family: var(--font-d);
      font-size: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-dim);
      margin-right: 4px;
    }
    .instance-strip {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }
    .instance-strip .label {
      font-family: var(--font-d);
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted-dim);
    }
    .inst-chip {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font-m);
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .inst-chip[aria-pressed="true"] {
      color: var(--fg);
      background: var(--accent-wash);

  function matchesWeapon(w) {
    if (state.scope === "owned") {
      if (!state.signedIn) return false;

    if (q) {

      if (!hay.includes(q)) return false;

    for (const [facet, map] of Object.entries(state.facets)) {
      const includes = Object.entries(map).filter(([, s]) => s === "include").map(([v]) => v);
      const excludes = Object.entries(map).filter(([, s]) => s === "exclude").map(([v]) => v);
      let field;

      else if (facet === "frame") field = (w.frame || "").toLowerCase().replace(/ frame$/, "");

  function sortWeapons(list) {
    return list.slice().sort((a, b) => {
      const sa = SLOT_ORDER[a.slot] ?? 9, sb = SLOT_ORDER[b.slot] ?? 9;

      const ea = a.rarity === "exotic" ? 0 : 1, eb = b.rarity === "exotic" ? 0 : 1;
      if (ea !== eb) return ea - eb;
      const aa = AMMO_ORDER[a.ammo] ?? 9, ab = AMMO_ORDER[b.ammo] ?? 9;
      if (aa !== ab) return aa - ab;
      return displayName(a).localeCompare(displayName(b));
    });
  }

    $("#count-label").innerHTML = `<strong>${list.length}</strong> identities`;
  }

  function renderPerkCell(name, { selected, pool, unknown }) {
    const label = unknown || name === "Unknown perk" ? "Unknown perk" : name;
    const cls = ["perk-cell", selected ? "selected" : "", pool ? "pool" : "", (unknown || name === "Unknown perk") ? "unknown" : ""]
      .filter(Boolean).join(" ");
    const iconPath = (!unknown && name !== "Unknown perk") ? PERK_ICONS[name] : null;
    const mark = (unknown || name === "Unknown perk")
      ? "?"
      : (label && label[0] ? label[0].toUpperCase() : "◆");
    const icoInner = iconPath
      ? `<img src="${CDN}${iconPath}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${mark}'))" />`
      : escapeHtml(mark);
    return `<div class="${cls}" title="${escapeHtml(label)}">
      <span class="ico" aria-hidden="true">${icoInner}</span>
      <span class="cap">${escapeHtml(label)}</span>
    </div>`;
  }

  /** Same column spacing for selected-only and can-roll (Image 1). Origin when present. */
  function renderPerkGrid(w, { showCanRoll, craftMode }) {
    const source = craftMode && w.craftColumns ? w.craftColumns : w.perks;
    const owned = hasOwnedInstance(w);
    const expand = showCanRoll || (!owned && !craftMode);
    const cells = PERK_COL_KEYS.map((k) => {
      const col = source[k];
      if (!col) return "";
      const label = COL_LABELS[k] || k;
      if (col.poolMissing && expand) {
        const sel = col.selected
          ? renderPerkCell(col.selected, { selected: true, pool: false, unknown: col.unknown })
          : "";
        return `<div class="perk-col">
          <div class="perk-col-label">${escapeHtml(label)}</div>
          ${sel}
          <div class="col-missing">Pool unavailable for this column</div>
        </div>`;
      }
      if (expand) {
        const pool = col.pool || [];
        if (!pool.length && !col.selected) {
          return `<div class="perk-col"><div class="perk-col-label">${escapeHtml(label)}</div><div class="col-missing">No plug data</div></div>`;
        }
        const names = pool.length ? pool : (col.selected ? [col.selected] : []);
        const html = names.map((n) => {
          const isSel = owned && col.selected && n === col.selected;
          const unk = n === "Unknown perk" || (col.unknown && n === col.selected);
          const selected = owned ? isSel : false;
          const poolCell = owned ? !isSel : true;
          return renderPerkCell(n, { selected, pool: poolCell, unknown: unk });
        }).join("");
        return `<div class="perk-col"><div class="perk-col-label">${escapeHtml(label)}</div>${html}</div>`;
      }
      if (!col.selected) return "";
      return `<div class="perk-col">
        <div class="perk-col-label">${escapeHtml(label)}</div>
        ${renderPerkCell(col.selected, { selected: true, pool: false, unknown: col.unknown || col.selected === "Unknown perk" })}
      </div>`;
    }).join("");
    return `<div class="perk-scroll"><div class="perk-grid-cols">${cells}</div></div>`;
  }

  function renderStats(w) {
    if (!w.stats || !Object.keys(w.stats).length) return "";
    const rows = Object.entries(w.stats).map(([k, v]) => {
      const pct = Math.min(100, Math.round((Number(v) / 100) * 100));
      return `<div class="stat-row">
        <span>${escapeHtml(cap(k))}</span>
        <span class="stat-bar" aria-hidden="true"><i style="width:${pct}%"></i></span>
        <span class="stat-val">${escapeHtml(String(v))}</span>
      </div>`;
    }).join("");
    return `<section><h3 class="section-title">Stats</h3><div class="stat-rows">${rows}</div></section>`;
  }

  function renderDetail() {
    const el = $("#detail");
    const w = selectedWeapon();
    if (!w) {
      el.innerHTML = `<div style="padding:40px 20px;text-align:center;color:var(--muted)">
        <div style="font-family:var(--font-d);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted-dim);margin-bottom:8px">Detail</div>
        <p>Select a weapon to inspect</p>
      </div>`;
      return;
    }
    const name = displayName(w);
    const exotic = w.rarity === "exotic";
    const inst = instancesFor(w);
    if (!state.selectedInstanceId && inst[0]) state.selectedInstanceId = inst[0].id;
    const ownedInst = hasOwnedInstance(w);
    const craftOk = !!(w.craftAvailable && w.craftColumns);

    let instanceHtml = "";
    if (!state.signedIn) {
      instanceHtml = `<span class="inst-note">Sign in + sync for owned copies. Manifest possible rolls only.</span>`;
    } else if (!w.owned) {
      instanceHtml = `<span class="inst-note">Not owned · definition possible rolls · no fake selected</span>`;
    } else if (inst.length) {
      instanceHtml = `<span class="label">Instances</span>` + inst.map((i) => {
        const marks = [];
        if (i.mw) marks.push(i.mw);
        if (i.crafted) marks.push("Craft");
        return `<button type="button" class="inst-chip" data-inst="${escapeHtml(i.id)}"
          aria-pressed="${state.selectedInstanceId === i.id ? "true" : "false"}">
          <span class="pw">${i.power}</span>
          ${marks.length ? `<span class="mark">${escapeHtml(marks.join(" · "))}</span>` : ""}
        </button>`;
      }).join("");
    }

    const synergyHtml = (w.reverseSynergies && w.reverseSynergies.length)
      ? `<div class="synergy-chips">${w.reverseSynergies.map((s) =>
          `<span class="synergy-chip"><span class="tag">Syn</span>${escapeHtml(s)}</span>`
        ).join("")}</div>`
      : "";

    let exoticBlock = "";
    if (exotic && w.intrinsic) {
      exoticBlock = `<section>
        <h3 class="section-title">Exotic identity</h3>
        ${renderPerkCell(w.intrinsic, { selected: true, pool: false, unknown: false })}
        <div class="catalyst-soft">
          <span class="flag">Catalyst</span>
          <div>
            <div>${escapeHtml(w.catalystLabel || "Catalyst soft-only")}</div>
            <div class="note">Never a hard gate (DBR-ROLL-007). Craft + catalyst independent.</div>
          </div>
        </div>
      </section>`;
    }

    const toggles = [];
    if (ownedInst) {
      toggles.push(`<button type="button" class="view-toggle" id="tog-can-roll" aria-pressed="${state.showCanRoll}">
        <span class="knob" aria-hidden="true"></span> Can roll
      </button>`);
    }
    if (craftOk) {
      toggles.push(`<button type="button" class="view-toggle" id="tog-craft" aria-pressed="${state.showPossibleCraft}">
        <span class="knob" aria-hidden="true"></span> Possible crafted
      </button>`);
    }

    const showingCraft = craftOk && state.showPossibleCraft;
    const showingPool = ownedInst ? state.showCanRoll : true;
    let note = "";
    if (!ownedInst) note = `<p class="plug-note">Unowned · definition possible rolls · no selected chrome.</p>`;
    else if (!state.showCanRoll && !showingCraft) note = `<p class="plug-note">Selected plugs only · Can roll OFF default.</p>`;
    else if (state.showCanRoll) note = `<p class="plug-note">Selected cyan · pool hairline · honest missing columns.</p>`;
    if (showingCraft) note += `<p class="plug-note">Same column UI as Perks · no duplicate current-craft list.</p>`;

    const unkHash = (w.perks.trait2 && w.perks.trait2.selectedHash) ? ` · unknown plug ${w.perks.trait2.selectedHash}` : "";

    el.innerHTML = `
      <div class="detail-header">
        <div class="header-row">
          <div class="header-icon" aria-hidden="true">${w.icon || "?"}</div>
          <div class="header-stack">
            <h2 class="hero-name ${exotic ? "exotic" : ""}">${escapeHtml(name)}</h2>
            ${metaIconsHtml(w)}
          </div>
        </div>
        ${synergyHtml}
        <div class="instance-strip">${instanceHtml}</div>
      </div>
      <div class="detail-body">
        ${exoticBlock}
        ${renderStats(w)}
        <section>
          <div class="section-head">
            <h3 class="section-title">${showingCraft ? "Possible crafted" : "Perks"}</h3>
            ${toggles.join("")}
          </div>
          ${renderPerkGrid(w, { showCanRoll: showingPool && !showingCraft, craftMode: showingCraft })}
          ${note}
        </section>
        <section>
          <h3 class="section-title">Outbound</h3>
          <div class="detail-footer">
            <button type="button" class="btn btn-stub" disabled>Add to Set</button>
            <button type="button" class="btn btn-stub" disabled>Open Synergy</button>
            <span class="stub-note">Set / Synergy deferred — disabled stubs only. Chips above display-only. No live create this residual.</span>
            <div class="hash-footer">Item hash ${w.hash}${unkHash} · footer only</div>
          </div>
        </section>
      </div>`;
  }

  function syncChrome() {
    $$("[data-scope]").forEach((b) => {
      b.setAttribute("aria-pressed", b.dataset.scope === state.scope ? "true" : "false");
    });
    $("#auth-in").setAttribute("aria-pressed", state.signedIn ? "true" : "false");
    $("#auth-out").setAttribute("aria-pressed", state.signedIn ? "false" : "true");
    const lamp = $("#sync-lamp");
    const label = $("#sync-label");
    if (!state.signedIn) {
      lamp.className = "lamp off";
      label.textContent = "Signed out";
    } else if (state.scenario === "loading") {
      lamp.className = "lamp warn";
      label.textContent = "Syncing";
    } else if (state.scenario === "missing-manifest") {
      lamp.className = "lamp danger";
      label.textContent = "No manifest";
    } else if (state.scenario === "owned-empty") {
      lamp.className = "lamp warn";
      label.textContent = "Empty";
    } else {
      lamp.className = "lamp";
      label.textContent = "Synced";
    }
    $("#reset-btn").hidden = !hasActiveFilters();
    $("#search").value = state.search;
    $$(".chip[data-facet]").forEach((btn) => {
      const st = getFacetState(btn.dataset.facet, btn.dataset.value);
      btn.dataset.state = st;
      const mark = btn.querySelector(".chip-mark");
      if (mark) {
        if (st === "include") { mark.hidden = false; mark.textContent = "+"; }
        else if (st === "exclude") { mark.hidden = false; mark.textContent = "−"; }
        else { mark.hidden = true; mark.textContent = ""; }
      }
    });

    const phone = $("#phone");
    const back = $("#back-btn");
    const title = $("#top-title");
    if (state.detailOpen && state.selectedId) {
      phone.classList.add("detail-open");
      back.hidden = false;
      const w = selectedWeapon();
      title.textContent = w ? displayName(w) : "Detail";
    } else {
      phone.classList.remove("detail-open");
      back.hidden = true;
      title.textContent = "Weapons";
    }
  }

  function renderAll() {
    syncChrome();
    renderBoard();
    if (state.detailOpen) renderDetail();
  }

  function openDetail(id) {
    state.selectedId = id;
    state.selectedInstanceId = null;
    state.showCanRoll = false;
    state.showPossibleCraft = false;
    const w = selectedWeapon();
    const inst = w ? instancesFor(w) : [];
    if (inst[0]) state.selectedInstanceId = inst[0].id;
    state.detailOpen = true;
    renderAll();
    renderDetail();
    announce("Opened " + (w ? displayName(w) : ""));
  }

  function closeDetail() {
    state.detailOpen = false;
    state.selectedId = null;
    state.selectedInstanceId = null;
    state.showCanRoll = false;
    state.showPossibleCraft = false;
    renderAll();
    announce("Back to weapons list");
  }

  function applyScenario(sc) {
    state.scenario = sc;
    state.showCanRoll = false;
    state.showPossibleCraft = false;
    state.search = "";
    state.facets = {};
    state.selectedInstanceId = null;
    state.detailOpen = false;
    state.selectedId = null;

    if (sc === "signed-out") {
      state.signedIn = false; state.scope = "all";
      state.selectedId = "w3"; state.detailOpen = true;
    } else if (sc === "signed-out-owned") {
      state.signedIn = false; state.scope = "owned";
    } else if (sc === "loading") {
      state.signedIn = true; state.scope = "all";
    } else if (sc === "owned-empty") {
      state.signedIn = true; state.scope = "owned";
    } else if (sc === "owned") {
      state.signedIn = true; state.scope = "owned";
      state.selectedId = "w4"; state.selectedInstanceId = "i4"; state.detailOpen = true;
    } else if (sc === "can-roll") {
      state.signedIn = true; state.scope = "all";
      state.selectedId = "w4"; state.selectedInstanceId = "i4";
      state.showCanRoll = true; state.detailOpen = true;
    } else if (sc === "partial-pool") {
      state.signedIn = true; state.scope = "all";
      state.selectedId = "w8"; state.selectedInstanceId = "i9";
      state.showCanRoll = true; state.detailOpen = true;
    } else if (sc === "craft-missing") {
      state.signedIn = true; state.scope = "all";
      state.selectedId = "w4"; state.selectedInstanceId = "i4"; state.detailOpen = true;
    } else if (sc === "craftable-exotic") {
      state.signedIn = true; state.scope = "all";
      state.selectedId = "w2"; state.selectedInstanceId = "i3";
      state.showPossibleCraft = true; state.detailOpen = true;
    } else if (sc === "unknown-perk") {
      state.signedIn = true; state.scope = "all";
      state.selectedId = "w7"; state.selectedInstanceId = "i8"; state.detailOpen = true;
    } else if (sc === "stubs") {
      state.signedIn = true; state.scope = "all";
      state.selectedId = "w1"; state.selectedInstanceId = "i1"; state.detailOpen = true;
    } else if (sc === "zero") {
      state.signedIn = true; state.scope = "all";
      setFacetState("element", "strand", "include");
      setFacetState("ammo", "heavy", "include");
    } else if (sc === "missing-manifest") {
      state.signedIn = true; state.scope = "all";
    } else {
      state.signedIn = true; state.scope = "all";
    }
    renderAll();
    if (state.detailOpen) renderDetail();
    announce("Scenario: " + sc);
  }

  $("#scenario").addEventListener("change", (e) => applyScenario(e.target.value));
  $("#auth-in").addEventListener("click", () => {
    state.signedIn = true;
    if (state.scenario.startsWith("signed-out")) {
      state.scenario = "results";
      $("#scenario").value = "results";
    }
    renderAll();
  });
  $("#auth-out").addEventListener("click", () => {
    state.signedIn = false;
    closeDetail();
    state.scenario = state.scope === "owned" ? "signed-out-owned" : "signed-out";
    $("#scenario").value = state.scenario;
    renderAll();
  });
  $("#back-btn").addEventListener("click", closeDetail);

  $$("[data-scope]").forEach((b) => {
    b.addEventListener("click", () => {
      state.scope = b.dataset.scope;
      if (!state.signedIn && state.scope === "owned") {
        state.scenario = "signed-out-owned";
        $("#scenario").value = "signed-out-owned";
      } else if (state.scenario === "signed-out-owned" && state.scope === "all") {
        state.scenario = "signed-out";
        $("#scenario").value = "signed-out";
      } else if (state.scenario === "owned-empty" && state.scope === "all") {
        state.scenario = "results";
        $("#scenario").value = "results";
      }
      closeDetail();
    });
  });

  $("#search").addEventListener("input", (e) => {
    state.search = e.target.value;
    if (state.scenario === "zero" && !hasActiveFilters()) {
      state.scenario = "results";
      $("#scenario").value = "results";
    }
    renderAll();
  });

  function clearAllFilters() {
    state.facets = {};
    state.search = "";
    if (state.scenario === "zero") {
      state.scenario = "results";
      $("#scenario").value = "results";
    }
    renderAll();
  }

  $("#filter-bar").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip[data-facet]");
    if (chip) {
      const next = cycleState(chip.dataset.state || "off");
      setFacetState(chip.dataset.facet, chip.dataset.value, next);
      if (state.scenario === "zero" && activeFilters().length === 0) {
        state.scenario = "results";
        $("#scenario").value = "results";
      }
      renderAll();
      return;
    }
    if (e.target.closest("[data-action='clear-filters']")) clearAllFilters();
  });

  $("#board").addEventListener("click", (e) => {
    const card = e.target.closest(".weapon-card[data-id]");
    if (card) {
      openDetail(card.dataset.id);
      return;
    }
    const action = e.target.closest("[data-action]");
    if (!action) return;
    const a = action.dataset.action;
    if (a === "sign-in") {
      state.signedIn = true; state.scenario = "owned";
      $("#scenario").value = "owned"; renderAll();
    } else if (a === "scope-all") {
      state.scope = "all";
      state.scenario = state.signedIn ? "results" : "signed-out";
      $("#scenario").value = state.scenario; renderAll();
    } else if (a === "sync") {
      state.scenario = "results"; state.scope = "all";
      $("#scenario").value = "results"; renderAll();
    } else if (a === "clear-filters") {
      clearAllFilters();
    } else if (a === "reload") {
      state.scenario = "results";
      $("#scenario").value = "results"; renderAll();
    } else if (a === "settings") {
      announce("Navigate to Settings (mock)");
    }
  });

  $("#detail").addEventListener("click", (e) => {
    const inst = e.target.closest("[data-inst]");
    if (inst) {
      state.selectedInstanceId = inst.dataset.inst;
      state.showCanRoll = false;
      state.showPossibleCraft = false;
      renderDetail();
      return;
    }
    if (e.target.closest("#tog-can-roll")) {
      state.showCanRoll = !state.showCanRoll;
      if (state.showCanRoll) state.showPossibleCraft = false;
      renderDetail();
      return;
    }
    if (e.target.closest("#tog-craft")) {
      state.showPossibleCraft = !state.showPossibleCraft;
      if (state.showPossibleCraft) state.showCanRoll = false;
      renderDetail();
    }
  });

  applyScenario("results");
})();
  </script>
</body>
</html>
