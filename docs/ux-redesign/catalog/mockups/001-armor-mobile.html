<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Catalog · Armor mode (C8) — Mobile structure mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05050f;
      --surface: #0a0a18;
      --raised: #101028;
      --line: rgba(232, 238, 242, 0.22);
      --line-strong: rgba(232, 238, 242, 0.38);
      --fg: #f0fdff;
      --muted: #7dd3e0;
      --muted-dim: rgba(125, 211, 224, 0.45);
      --accent: #00e5ff;
      --accent-wash: rgba(0, 229, 255, 0.14);
      --danger: #ff003c;
      --success: #2ee6a6;
      --warn: #f5c542;
      --rarity-exotic: #ceae33;
      --rarity-legendary: #4a2458;
      --rarity-legendary-edge: #c49ad4;
      --class-titan: #e35a3d;
      --class-hunter: #5aa8e0;
      --class-warlock: #c9a24d;
      --font-d: "Orbitron", system-ui, sans-serif;
      --font-b: "Inter", system-ui, sans-serif;
      --font-m: "JetBrains Mono", ui-monospace, monospace;
      --radius: 2px;
      --nav-h: 52px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --phone-w: 390px;
      --phone-h: 780px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #030308;
      color: var(--fg);
      font-family: var(--font-b);
      font-size: 13px;
      line-height: 1.35;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: transparent; padding: 0; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .mock-bar {
      flex: 0 0 auto;
      width: 100%;
      max-width: 430px;
      padding: 8px 10px;
      background: #080812;
      border-bottom: 1px solid var(--line-strong);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mock-bar h1 {
      margin: 0;
      font-family: var(--font-d);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .mock-bar .meta {
      font-family: var(--font-m);
      font-size: 9px;
      color: var(--muted-dim);
    }
    .scenario-select {
      width: 100%;
      height: 32px;
      padding: 0 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font-m);
      font-size: 11px;
    }
    .auth-row { display: flex; gap: 6px; }
    .auth-row button {
      flex: 1;
      height: 28px;
      font-family: var(--font-d);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .auth-row button[aria-pressed="true"] {
      color: var(--fg);
      background: var(--accent-wash);
      border-color: rgba(0, 229, 255, 0.4);
    }

    .phone {
      flex: 1;
      min-height: 0;
      width: min(100%, var(--phone-w));
      max-height: min(100vh - 150px, var(--phone-h));
      margin: 8px auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .topbar {
      flex: 0 0 auto;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .topbar .title-stack { flex: 1; min-width: 0; }
    .topbar .title {
      font-family: var(--font-d);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .topbar .sub {
      font-family: var(--font-m);
      font-size: 9px;
      color: var(--muted-dim);
    }
    .defer-badge {
      font-family: var(--font-d);
      font-size: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--warn);
      border: 1px solid rgba(245, 197, 66, 0.4);
      padding: 4px 6px;
      border-radius: var(--radius);
      white-space: nowrap;
    }

    .mode-row {
      flex: 0 0 auto;
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .mode-row button {
      flex: 1;
      height: 34px;
      font-family: var(--font-d);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 2px solid transparent;
    }
    .mode-row button[aria-current="true"] {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--accent-wash);
    }
    .mode-row button:disabled { opacity: 0.35; }

    .filter-bar {
      flex: 0 0 auto;
      padding: 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .scope-seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      height: 32px;
    }
    .scope-seg button {
      flex: 1;
      font-family: var(--font-d);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border-right: 1px solid var(--line);
    }
    .scope-seg button:last-child { border-right: 0; }
    .scope-seg button[aria-pressed="true"] {
      color: var(--fg);
      background: var(--accent-wash);
      box-shadow: inset 0 -1px 0 var(--accent);
    }
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 10px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .search-wrap input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      outline: none;
      font-size: 13px;
    }
    .facet-scroll {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .facet-scroll::-webkit-scrollbar { height: 0; }
    .chip {
      height: 30px;
      padding: 0 8px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--muted);
      font-size: 11px;
    }
    .chip.icon-only { width: 30px; padding: 0; justify-content: center; }
    .chip[data-state="include"] {
      color: var(--fg);
      background: var(--accent-wash);
      border-color: rgba(0, 229, 255, 0.4);
    }
    .chip[data-state="exclude"] {
      color: var(--warn);
      border-color: rgba(245, 197, 66, 0.45);
      background: rgba(245, 197, 66, 0.08);
      text-decoration: line-through;
    }
    .chip .chip-mark {
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--accent);
    }
    .chip[data-state="exclude"] .chip-mark { color: var(--warn); }
    .glyph-ico.exotic { color: var(--rarity-exotic); }
    .glyph-ico.titan { color: var(--class-titan); }
    .glyph-ico.hunter { color: var(--class-hunter); }
    .glyph-ico.warlock { color: var(--class-warlock); }
    .reset-btn {
      height: 30px;
      padding: 0 10px;
      flex-shrink: 0;
      font-family: var(--font-d);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--danger);
      border: 1px solid rgba(255, 0, 60, 0.4);
      border-radius: var(--radius);
    }
    .reset-btn[hidden] { display: none !important; }

    .soft-banner {
      display: none;
      padding: 8px 10px;
      background: rgba(245, 197, 66, 0.08);
      border-bottom: 1px solid rgba(245, 197, 66, 0.28);
      font-size: 11px;
      color: var(--muted);
      gap: 8px;
      align-items: flex-start;
    }
    .soft-banner[data-show="true"] { display: flex; }
    .soft-banner .flag {
      font-family: var(--font-d);
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--warn);
      flex-shrink: 0;
    }

    .results-meta {
      flex: 0 0 auto;
      padding: 6px 10px;
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .results-meta strong { color: var(--fg); font-weight: 500; }

    .board {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      align-content: start;
      -webkit-overflow-scrolling: touch;
    }

    .armor-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100px;
      padding: 8px;
      text-align: left;
      border: 1px solid rgba(232, 238, 242, 0.12);
      border-radius: var(--radius);
      background: rgba(10, 10, 24, 0.88);
      overflow: hidden;
    }
    .armor-card[aria-selected="true"] {
      border-color: rgba(0, 229, 255, 0.45);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.15);
    }
    .armor-card[aria-selected="true"]::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--accent);
    }
    .armor-card.rarity-exotic {
      background-image: linear-gradient(270deg, rgba(206,174,51,0.2) 0%, transparent 55%);
    }
    .armor-card.rarity-legendary {
      background-image: linear-gradient(270deg, color-mix(in srgb, var(--rarity-legendary-edge) 18%, transparent) 0%, transparent 55%);
    }
    .card-top { display: flex; gap: 6px; min-width: 0; }
    .entity-icon {
      width: 32px; height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font-m);
      font-size: 12px;
      color: var(--muted);
    }
    .entity-icon.exotic-frame { border-color: rgba(206,174,51,0.55); color: var(--rarity-exotic); }
    .card-text { flex: 1; min-width: 0; }
    .card-name {
      font-family: var(--font-d);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .armor-card.rarity-exotic .card-name { color: var(--rarity-exotic); }
    .card-type { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .card-foot {
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid rgba(232, 238, 242, 0.12);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .meta-ico {
      width: 16px; height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 2px;
      font-family: var(--font-m);
      font-size: 9px;
      color: var(--muted);
    }
    .meta-ico.class-titan { color: var(--class-titan); }
    .meta-ico.class-hunter { color: var(--class-hunter); }
    .meta-ico.class-warlock { color: var(--class-warlock); }
    .owned-count {
      margin-left: auto;
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--accent);
    }
    .rarity-badge {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
    }
    .rarity-badge.exotic { color: var(--rarity-exotic); }

    .state-panel {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 12px;
      min-height: 220px;
    }
    .state-card {
      text-align: center;
      padding: 20px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      max-width: 320px;
    }
    .state-card .kicker {
      font-family: var(--font-d);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted-dim);
      margin-bottom: 6px;
    }
    .state-card h2 {
      margin: 0 0 8px;
      font-family: var(--font-d);
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .state-card p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .state-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

    .btn {
      height: 36px;
      padding: 0 12px;
      font-family: var(--font-d);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
    }
    .btn-primary {
      background: var(--accent-wash);
      border-color: rgba(0, 229, 255, 0.4);
    }
    .btn-stub {
      opacity: 0.42;
      color: var(--muted);
      background: var(--bg);
    }

    /* Full-screen detail sheet */
    .sheet {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      background: var(--surface);
    }
    .sheet[data-open="true"] { display: flex; }
    .sheet-bar {
      flex: 0 0 auto;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      border-bottom: 1px solid var(--line);
    }
    .sheet-bar .back {
      width: 40px; height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 20px;
    }
    .sheet-bar .label {
      font-family: var(--font-d);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .sheet-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
      padding-bottom: calc(16px + var(--safe-b));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header-row { display: flex; gap: 10px; align-items: flex-start; }
    .header-icon {
      width: 48px; height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font-m);
      font-size: 16px;
      color: var(--muted);
    }
    .header-icon.exotic { border-color: rgba(206,174,51,0.55); color: var(--rarity-exotic); }
    .hero-name {
      margin: 0;
      font-family: var(--font-d);
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.25;
    }
    .hero-name.exotic { color: var(--rarity-exotic); }
    .hero-type { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .meta-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .pill {
      height: 20px;
      padding: 0 7px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font-m);
      font-size: 10px;
      background: var(--raised);
    }
    .pill.owned { color: var(--success); border-color: rgba(46,230,166,0.35); }
    .pill.exotic { color: var(--rarity-exotic); border-color: rgba(206,174,51,0.4); }

    .instance-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .instance-strip .label {
      font-family: var(--font-d);
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted-dim);
      width: 100%;
    }
    .inst-chip {
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: var(--font-m);
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      display: inline-flex;
      gap: 5px;
      align-items: center;
    }
    .inst-chip[aria-pressed="true"] {
      color: var(--fg);
      background: var(--accent-wash);
      box-shadow: inset 2px 0 0 var(--accent);
    }
    .inst-chip .pw { color: var(--fg); font-weight: 500; }

    .section-title {
      font-family: var(--font-d);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .section-note {
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--muted-dim);
      margin: -4px 0 8px;
      line-height: 1.4;
    }

    .stat-board {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg);
    }
    .stat-board-head {
      display: grid;
      grid-template-columns: 1fr 48px 48px;
      gap: 4px;
      padding: 6px 8px;
      background: var(--raised);
      border-bottom: 1px solid var(--line);
      font-family: var(--font-d);
      font-size: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-dim);
    }
    .stat-board-head .col-base { text-align: right; color: var(--muted); }
    .stat-board-head .col-live { text-align: right; color: var(--accent); }
    .stat-board-row {
      display: grid;
      grid-template-columns: 1fr 48px 48px;
      gap: 4px;
      padding: 5px 8px;
      border-bottom: 1px solid rgba(232,238,242,0.08);
      font-family: var(--font-m);
      font-size: 11px;
    }
    .stat-board-row:last-child { border-bottom: 0; }
    .stat-board-row .name { color: var(--muted); }
    .stat-board-row .val-base { text-align: right; color: var(--fg); }
    .stat-board-row .val-live { text-align: right; color: var(--accent); }
    .stat-board-row.total {
      background: rgba(0,229,255,0.04);
      border-top: 1px solid var(--line);
      font-weight: 600;
    }
    .stat-board.base-only .stat-board-head,
    .stat-board.base-only .stat-board-row { grid-template-columns: 1fr 48px; }
    .stat-board.base-only .col-live,
    .stat-board.base-only .val-live { display: none; }
    .stat-board-omit {
      padding: 8px;
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--muted-dim);
      border-top: 1px dashed var(--line);
      line-height: 1.4;
    }

    .energy-meter { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .energy-bar {
      flex: 1;
      height: 8px;
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: 1px;
      overflow: hidden;
    }
    .energy-bar > i { display: block; height: 100%; background: var(--accent); opacity: 0.8; }
    .energy-label { font-family: var(--font-m); font-size: 11px; white-space: nowrap; }
    .mod-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .mod-cell {
      width: 60px;
      padding: 6px 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      text-align: center;
      font-size: 10px;
    }
    .mod-cell .ico {
      width: 26px; height: 26px;
      margin: 0 auto 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--raised);
      border: 1px solid var(--line);
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--muted);
    }
    .mod-cell .cap { color: var(--muted); line-height: 1.15; -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .mod-cell .cost { font-family: var(--font-m); font-size: 9px; color: var(--accent); margin-top: 2px; }

    .callout {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
    }
    .callout.set { border-color: rgba(0,229,255,0.22); background: rgba(0,229,255,0.04); }
    .callout.exotic { border-color: rgba(206,174,51,0.35); background: rgba(206,174,51,0.06); }
    .callout.none { border-style: dashed; color: var(--muted); }
    .callout .kicker {
      font-family: var(--font-d);
      font-size: 8px;

        { id: "sf1", power: 1990, baseTotal: 64, live: { weapons: 8, health: 18, class: 10, grenade: 30, super: 20, melee: 10 }, energy: { used: 3, cap: 10 }, mods: [
          { name: "Harmonic Resistance", cost: 1, ico: "HR" },
        ]},
      ],
    },
    {
      id: "field-plate-ci", name: "Field-Forged Mark", class: "titan", slot: "classitem",
      rarity: "legendary", tier: 4, exotic: false, icon: "FM",
      base: { weapons: 2, health: 2, class: 2, grenade: 2, super: 2, melee: 2 },
      setBonus: { family: "Field Plate", pc2: "Melee hits grant temporary damage resistance.", pc4: "Melee final blows restore a portion of health." },
      owned: 2,
      instances: [
        { id: "ci1", power: 2000, baseTotal: 12, live: { weapons: 2, health: 2, class: 2, grenade: 2, super: 2, melee: 2 }, energy: { used: 2, cap: 10 }, mods: [
          { name: "Powerful Attraction", cost: 2, ico: "PA" },
        ]},
      ],
    },
    {
      id: "khepri-sting", name: "Khepri's Sting", class: "hunter", slot: "gauntlets",
      rarity: "exotic", tier: 4, exotic: true, icon: "KS",
      base: { weapons: 10, health: 8, class: 14, grenade: 12, super: 10, melee: 22 },
      setBonus: null,
      exoticPerk: { name: "Touch of Venom", body: "Smoke bombs weaken on hit." },
      owned: 0, instances: [],
    },
  ];

  const state = {
    scenario: "results",
    signedIn: true,
    scope: "all",
    search: "",
    facets: {},
    selectedId: null,
    instanceId: null,
  };

  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const board = $("#board");
  const sheet = $("#sheet");
  const sheetBody = $("#sheet-body");
  const live = $("#live");

  function announce(m) { live.textContent = m; }
  function baseTotal(stats) {
    if (!stats) return 0;
    return STAT_KEYS.reduce((s, k) => s + (stats[k.key] || 0), 0);
  }
  function cycleState(cur) {
    if (cur === "off" || !cur) return "include";
    if (cur === "include") return "exclude";
    return "off";
  }
  function getFacetState(facet, value) {
    return (state.facets[facet] && state.facets[facet][value]) || "off";
  }
  function setFacetState(facet, value, st) {
    if (!state.facets[facet]) state.facets[facet] = {};
    if (st === "off") delete state.facets[facet][value];
    else state.facets[facet][value] = st;
    if (state.facets[facet] && !Object.keys(state.facets[facet]).length) delete state.facets[facet];
  }
  function hasActiveFilters() {
    if (state.search.trim()) return true;
    return Object.keys(state.facets).some((f) => Object.keys(state.facets[f] || {}).length);
  }
  function ownedCount(item) {
    if (!state.signedIn) return 0;
    return item.owned || 0;
  }
  function matchesFacets(item) {
    const q = state.search.trim().toLowerCase();
    if (q && !item.name.toLowerCase().includes(q)) return false;
    for (const [facet, map] of Object.entries(state.facets)) {
      const includes = Object.entries(map).filter(([, st]) => st === "include").map(([v]) => v);
      const excludes = Object.entries(map).filter(([, st]) => st === "exclude").map(([v]) => v);
      let val = facet === "class" ? item.class : facet === "slot" ? item.slot : (item.exotic ? "exotic" : "legendary");
      if (facet === "exotic" && excludes.includes("exotic") && item.exotic) return false;
      if (facet !== "exotic" && excludes.includes(val)) return false;
      if (includes.length) {
        if (facet === "exotic") {
          if (includes.includes("exotic") && !item.exotic) return false;
        } else if (!includes.includes(val)) return false;
      }
    }
    return true;
  }
  function filteredItems() {
    let list = ITEMS.slice();
    if (state.scope === "owned") list = list.filter((i) => ownedCount(i) > 0);
    list = list.filter(matchesFacets);
    list.sort((a, b) => {
      const s = (SLOT_ORDER[a.slot] ?? 9) - (SLOT_ORDER[b.slot] ?? 9);
      if (s) return s;
      const e = (b.exotic ? 1 : 0) - (a.exotic ? 1 : 0);
      if (e) return e;
      const c = (CLASS_ORDER[a.class] ?? 9) - (CLASS_ORDER[b.class] ?? 9);
      if (c) return c;
      return (b.tier || 0) - (a.tier || 0);
    });
    return list;
  }
  function sortedInstances(item) {
    return (item.instances || []).slice().sort((a, b) => {
      const bt = (b.baseTotal || 0) - (a.baseTotal || 0);
      if (bt) return bt;
      return (b.power || 0) - (a.power || 0);
    });
  }

  function updateChipUI() {
    $$(".chip[data-facet]").forEach((chip) => {
      const st = getFacetState(chip.dataset.facet, chip.dataset.value);
      chip.dataset.state = st;
      const mark = chip.querySelector(".chip-mark");
      if (mark) {
        if (st === "include") { mark.hidden = false; mark.textContent = "+"; }
        else if (st === "exclude") { mark.hidden = false; mark.textContent = "−"; }
        else { mark.hidden = true; mark.textContent = ""; }
      }
    });
    $("#reset-btn").hidden = !hasActiveFilters();
  }

  function renderEmpty(kind) {
    const map = {
      "sign-in": {
        k: "Owned · signed-out", t: "Sign in to see owned",

      "owned-empty": {
        k: "Owned · empty", t: "No owned armor",
        b: "Sync inventory or open Settings. No sample vault.",
        a: `<button type="button" class="btn btn-primary" data-action="sync">Sync</button>
            <button type="button" class="btn" data-action="settings">Settings</button>`,
      },
      "zero": {
        k: "Filters", t: "No matches",
        b: "Include OR within facet · AND across · exclude drops.",
        a: `<button type="button" class="btn btn-primary" data-action="clear-filters">Clear filters</button>`,
      },
    };
    const c = map[kind];
    return `<div class="state-panel"><div class="state-card" role="status">
      <div class="kicker">${c.k}</div><h2>${c.t}</h2><p>${c.b}</p>
      <div class="state-actions">${c.a}</div></div></div>`;
  }

  function renderCard(item) {
    const oc = ownedCount(item);
    return `<button type="button" class="armor-card rarity-${item.rarity}" role="option"
      aria-selected="${item.id === state.selectedId}" data-id="${item.id}">
      <div class="card-top">
        <div class="entity-icon ${item.exotic ? "exotic-frame" : ""}">${item.icon}</div>
        <div class="card-text">
          <div style="display:flex;gap:4px;align-items:flex-start">
            <span class="card-name">${item.name}</span>

          </div>
          <div class="card-type">${SLOT_LABEL[item.slot]} · ${CLASS_LABEL[item.class]}</div>
        </div>
      </div>
      <div class="card-foot">
        <span class="meta-ico class-${item.class}">${CLASS_GLYPH[item.class]}</span>
        <span class="meta-ico">${SLOT_GLYPH[item.slot]}</span>
        ${oc > 0 ? `<span class="owned-count">×${oc}</span>` : ""}
      </div>
    </button>`;
  }

  function renderBoard() {
    if (state.scope === "owned" && !state.signedIn) {
      board.innerHTML = renderEmpty("sign-in");

      return;
    }
    if (state.scope === "owned" && state.scenario === "owned-empty") {

      $("#count-label").innerHTML = `<strong>0</strong> owned · empty`;

  function renderStatBoard(item, inst, dual) {
    const base = item.base || {};
    const liveStats = dual && inst && inst.live ? inst.live : null;
    const rows = STAT_KEYS.map((s) =>
      `<div class="stat-board-row">
        <span class="name">${s.label}</span>
        <span class="val-base">${base[s.key] ?? "—"}</span>

    </div>`;
  }

  function renderSheet() {
    const item = ITEMS.find((i) => i.id === state.selectedId);
    if (!item) {
      sheet.dataset.open = "false";
      return;
    }
    sheet.dataset.open = "true";
    const oc = ownedCount(item);
    const canShowOwned = state.signedIn && oc > 0;
    const instances = canShowOwned ? sortedInstances(item) : [];
    if (canShowOwned && instances.length && !state.instanceId) state.instanceId = instances[0].id;
    if (!canShowOwned) state.instanceId = null;
    const inst = instances.find((i) => i.id === state.instanceId) || null;
    const dual = !!(inst && inst.live);
    const showMods = !!(inst && inst.mods && inst.mods.length);

    const strip = canShowOwned && instances.length
      ? `<div class="instance-strip" role="group" aria-label="Owned instances">

              <span class="pw">${i.power}</span><span>Σ${i.baseTotal}</span>
            </button>`
          ).join("")}
        </div>`
      : (!state.signedIn
        ? `<p class="section-note">Sign in to pin instance for live stats &amp; mods.</p>`

    const modsHtml = showMods

          <h3 class="section-title">Mods · energy</h3>
          <p class="section-note">Read-only equipped plugs (DIM-lite).</p>
          ${inst.energy ? `<div class="energy-meter">
            <div class="energy-bar"><i style="width:${Math.round((inst.energy.used / inst.energy.cap) * 100)}%"></i></div>
            <span class="energy-label">${inst.energy.used}/${inst.energy.cap}</span>
          </div>` : ""}
          <div class="mod-grid">${inst.mods.map((m) =>
            `<div class="mod-cell"><div class="ico">${m.ico}</div><div class="cap">${m.name}</div><div class="cost">${m.cost}e</div></div>`
          ).join("")}</div>
        </section>`
      : "";

    const setHtml = item.setBonus
      ? `<div class="callout set">
          <div class="kicker">Set bonus · definition</div>
          <div class="title">${item.setBonus.family}</div>
          <div class="tier"><span>2pc</span>${item.setBonus.pc2}</div>
          <div class="tier"><span>4pc</span>${item.setBonus.pc4}</div>
        </div>`
      : `<div class="callout none">
          <div class="kicker">Armor set bonus</div>
          <div class="title">No set bonus</div>
          <div class="body">Not a set-bonus family member (DO-ASB-015).</div>
        </div>`;

    const exoHtml = item.exotic && item.exoticPerk
      ? `<div class="callout exotic">
          <div class="kicker">Exotic perk · definition</div>
          <div class="title">${item.exoticPerk.name}</div>
          <div class="body">${item.exoticPerk.body}</div>
        </div>`
      : "";

    sheetBody.innerHTML = `
      <div class="header-row">
        <div class="header-icon ${item.exotic ? "exotic" : ""}">${item.icon}</div>
        <div>
          <h2 class="hero-name ${item.exotic ? "exotic" : ""}">${item.name}</h2>
          <div class="hero-type">${SLOT_LABEL[item.slot]} · ${CLASS_LABEL[item.class]}</div>
          <div class="meta-pills">
            ${item.exotic ? `<span class="pill exotic">Exotic</span>` : `<span class="pill">Legendary</span>`}
            ${item.tier ? `<span class="pill">Tier ${item.tier}</span>` : ""}
            ${canShowOwned ? `<span class="pill owned">Owned ×${oc}</span>` : `<span class="pill">Unowned</span>`}
          </div>
        </div>
      </div>
      ${strip}
      <section>
        <h3 class="section-title">Stats · EoF six</h3>
        <p class="section-note">${dual
          ? "<strong>Base</strong> = roll · <strong>Live</strong> = instance (DO-ARM-008)."
          : "Labeled <strong>Base</strong> only until instance pin."}</p>
        ${renderStatBoard(item, inst, dual)}
      </section>
      ${modsHtml}
      <section>
        <h3 class="section-title">Set bonus</h3>
        ${setHtml}
      </section>
      ${exoHtml ? `<section><h3 class="section-title">Exotic</h3>${exoHtml}</section>` : ""}
      <div class="footer-actions">
        <button type="button" class="btn btn-stub" disabled>Add to Set</button>
        <button type="button" class="btn btn-stub" disabled>Open Synergy</button>
        <span class="stub-note">Outbound stubs only until C11. No Build kit attach (DBR-PUR-002).</span>
        <div class="hash-footer">hash · mock · ${item.id}</div>
      </div>`;
  }

  function updateChrome() {
    $("#auth-out").setAttribute("aria-pressed", state.signedIn ? "false" : "true");
    $("#auth-in").setAttribute("aria-pressed", state.signedIn ? "true" : "false");
    $$("[data-scope]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.scope === state.scope ? "true" : "false"));
    $("#soft-banner").dataset.show = state.scenario === "error" ? "true" : "false";
    updateChipUI();
  }

  function applyScenario(name) {
    state.scenario = name;
    state.search = "";
    state.facets = {};
    $("#search").value = "";
    state.selectedId = null;
    state.instanceId = null;
    sheet.dataset.open = "false";

    switch (name) {
      case "signed-out-owned":
        state.signedIn = false;
        state.scope = "owned";
        break;
      case "owned-empty":
        state.signedIn = true;
        state.scope = "owned";
        break;
      case "zero":
        state.signedIn = true;
        state.scope = "all";
        state.facets = { class: { titan: "include" }, slot: { helmet: "include" }, exotic: { exotic: "include" } };
        break;
      case "unowned-detail":
        state.signedIn = false;
        state.scope = "all";
        state.selectedId = "gwisin-vest";
        break;
      case "owned-multi":
        state.signedIn = true;
        state.scope = "all";
        state.selectedId = "lustrous-helm-t";
        state.instanceId = "i1";
        break;
      case "exotic-detail":
        state.signedIn = true;
        state.scope = "all";
        state.selectedId = "synthoceps";
        state.instanceId = "s1";
        break;
      case "error":
        state.signedIn = true;
        state.scope = "all";
        break;
      default:
        state.signedIn = true;
        state.scope = "all";
    }
    $("#scenario").value = name;
    render();
  }

  function render() {
    updateChrome();
    renderBoard();
    if (state.selectedId) renderSheet();
    else sheet.dataset.open = "false";
  }

  $("#scenario").addEventListener("change", (e) => applyScenario(e.target.value));
  $("#auth-out").addEventListener("click", () => { state.signedIn = false; render(); });
  $("#auth-in").addEventListener("click", () => { state.signedIn = true; render(); });
  $$("[data-scope]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.scope = btn.dataset.scope;
      state.selectedId = null;
      state.instanceId = null;
      sheet.dataset.open = "false";
      render();
    });
  });
  $("#search").addEventListener("input", (e) => {
    state.search = e.target.value;
    renderBoard();
    updateChipUI();
  });
  $("#facet-scroll").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip[data-facet]");
    if (chip) {
      const next = cycleState(getFacetState(chip.dataset.facet, chip.dataset.value));
      setFacetState(chip.dataset.facet, chip.dataset.value, next);
      render();
      return;
    }
    if (e.target.closest("#reset-btn")) {
      state.facets = {};
      state.search = "";
      $("#search").value = "";
      render();
    }
  });
  board.addEventListener("click", (e) => {
    const card = e.target.closest(".armor-card[data-id]");
    if (card) {
      state.selectedId = card.dataset.id;
      state.instanceId = null;
      render();
      announce("Opened detail");
      return;
    }
    const act = e.target.closest("[data-action]");
    if (!act) return;
    const a = act.dataset.action;
    if (a === "sign-in") { state.signedIn = true; render(); }
    else if (a === "scope-all") { state.scope = "all"; render(); }
    else if (a === "clear-filters") {
      state.facets = {};
      state.search = "";
      $("#search").value = "";
      if (state.scenario === "zero") state.scenario = "results";
      render();
    } else if (a === "sync" || a === "settings") {
      announce(a === "sync" ? "Sync stub" : "Settings stub");
    }
  });
  sheetBody.addEventListener("click", (e) => {
    const chip = e.target.closest(".inst-chip[data-inst]");
    if (chip) {
      state.instanceId = chip.dataset.inst;
      renderSheet();
    }
  });
  $("#sheet-back").addEventListener("click", () => {
    state.selectedId = null;
    state.instanceId = null;
    sheet.dataset.open = "false";
    renderBoard();
  });

  applyScenario("results");
})();
  </script>
</body>
</html>
