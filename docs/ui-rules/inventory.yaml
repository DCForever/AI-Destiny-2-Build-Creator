                kind: surface
                title: Variant cards / switcher
                rules:
                  - DBR-BLD-002
                  - DBR-BLD-003
                  - BR-VAR-001
                  - BR-VAR-003
              - id: build.library.edit
                kind: field
                title: Edit build (open composer)
                flowsTo:
                  - build.edit.general

      - id: build.create
        kind: screen
        title: Create Build (draft composer)
        path: /build
        auth: signed-in
        rules:
          - DAC-P1-001
          - DAC-P1-002
          - DAC-P2-005
          - DBR-PUR-004
          - DBR-SYN-002
          - DBR-SYN-003
          - DBR-BLD-004
          - BR-SAVE-003
          - 042:SC-001
        children:
          - id: build.create.tabs
            kind: surface
            title: Tab strip (locks before class/subclass)
            notes: General unlocked; Subclass/Armor/Weapon locked until draft identity
            children:
              - id: build.create.tab.general
                kind: field
                title: Tab — General
              - id: build.create.tab.subclass
                kind: field
                title: Tab — Subclass (locked)
              - id: build.create.tab.armor
                kind: field
                title: Tab — Armor (locked)
              - id: build.create.tab.weapon
                kind: field
                title: Tab — Weapon (locked)
              - id: build.create.tab.finish
                kind: field
                title: Tab — Finish (locked)
          - id: build.create.general
            kind: subscreen
            title: Draft General tab
            rules:
              - DAC-P1-001
              - DAC-P1-002
              - DAC-NME-001
            children:
              - id: build.create.class
                kind: field
                title: Class picker (Titan / Hunter / Warlock)
                rules:
