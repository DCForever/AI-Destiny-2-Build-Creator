                  - DBR-NAME-002
                  - DBR-NAME-004
                  - DAC-NME-001
              - id: build.create.synergy-types
                kind: field
                title: Synergy Type multi-select (≥1 required)
                rules:
                  - DAC-P1-001
                  - DBR-SYN-002
                  - DBR-SYN-003
                  - DBR-SYN-004
                  - DBR-SYN-013
                  - BR-SAVE-003
              - id: build.create.exotic-armor
                kind: field
                title: Exotic armor (optional identity)
                rules:
                  - DBR-ID-003
                  - DBR-ID-004
                  - DBR-ID-005
                  - BR-BLD-003
              - id: build.create.exotic-weapon
                kind: field
                title: Exotic weapon (variant or build-shared)
                rules:
                  - DBR-ID-006
                  - BR-BLD-004
              - id: build.create.pinned-super
                kind: field
                title: Build-pinned Super (optional)
                rules:
                  - DBR-ID-007
              - id: build.create.tags
                kind: field
                title: Concept tags (filter only)
                rules:
                  - DBR-ID-002
                  - BR-TAG-001
                  - BR-TAG-005
                  - BR-TAG-006
                  - DAC-NME-002
              - id: build.create.submit
                kind: field
                title: Create / save draft
                rules:
