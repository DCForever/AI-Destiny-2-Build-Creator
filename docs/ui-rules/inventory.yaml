# UI ↔ Rules inventory for Destiny 2 Build Creator
# Source of structure + rule ID attachments. Rule *text* lives in markdown specs.
# Regenerate diagram: npm run ui-rules:generate
# Edit rules:       npm run ui-rules:view  → companion at :4174
#
# kinds: page | screen | subscreen | surface | field | flow | gate | auth
# auth: signed-in | signed-out | any
# rules: DAC-*, DBR-*, BR-*, or slice ids like 001:SC-001, 015:US1-AS1

version: 1
title: Destiny 2 Build Creator — UI ↔ Rules Map
description: >
  Production UI map (screens, surfaces, data entry) with linked domain ACs (DAC),
  domain BRs (DBR), feature BRs (BR), and slice acceptance criteria.
  Complements docs/atlas screenshots. Debug routes are out of scope.

pages:
  # ─────────────────────────────────────────────
  - id: overview
    label: Overview
    description: App shell, navigation, auth, and primary journeys.
    nodes:
      - id: shell
        kind: screen
        title: App shell
        path: "/*"
        auth: any
        notes: Header, nav, theme, Bungie auth control
        rules:
          - DBR-PUR-001
          - DBR-PUR-002
          - DBR-PUR-003
          - BR-AUTH-001
        children:
          - id: shell.nav
            kind: surface
            title: Main navigation
            notes: Loadouts · Build · Synergy · Sets · Catalog · Settings
            rules:
              - DBR-PUR-003
            children:
              - id: shell.nav.loadouts
                kind: field
                title: Nav → In-Game Loadouts
                path: /loadouts
              - id: shell.nav.build
                kind: field
                title: Nav → Build
                path: /build
              - id: shell.nav.synergy
                kind: field
                title: Nav → Synergy
                path: /synergy
              - id: shell.nav.sets
                kind: field
                title: Nav → Sets
                path: /sets
              - id: shell.nav.catalog
                kind: field
                title: Nav → Catalog
                path: /catalog
              - id: shell.nav.settings
                kind: field
                title: Nav → Settings
                path: /settings
          - id: shell.auth
            kind: surface
            title: Bungie auth control
            rules:
              - BR-AUTH-001
            children:
              - id: shell.auth.login
                kind: field
                title: Sign in / Sign out
              - id: shell.auth.status
                kind: field
                title: Session status indicator
          - id: shell.theme
            kind: field
            title: Theme toggle
          - id: shell.signed-out-gate
            kind: gate
            title: SignedOutGate (shared)
            auth: signed-out
            rules:
              - BR-AUTH-001
              - 003:SC-005

      - id: journey.p1
        kind: flow
        title: "P1 Journey — Intent → compose → equip"
        rules:
          - DAC-P1-001
          - DAC-P1-002
          - DAC-P1-003
          - DAC-P1-004
          - DAC-P1-005
          - DAC-P1-006
          - DAC-P1-007
          - DAC-P1-008
          - DAC-P1-009
          - DBR-PUR-003
          - DBR-PUR-005
        flowsTo:
          - build.library
          - build.create
          - build.finish
        children:
          - id: journey.p1.intent
            kind: surface
            title: Designate Synergy Types
            rules:
              - DAC-P1-001
              - DBR-SYN-002
              - DBR-SYN-003
          - id: journey.p1.compose
            kind: surface
            title: Compose default variant (sets + kit)
            rules:
              - DAC-P1-003
              - DAC-P1-004
              - DBR-CMP-001
          - id: journey.p1.equip
            kind: surface
            title: Equip / DIM when equip-ready
            rules:
              - DAC-P1-005
              - DAC-P1-007
              - DAC-P1-008
              - DBR-EQP-001
              - DBR-EQP-003

      - id: journey.p2
        kind: flow
        title: "P2 Journey — Library curation"
        rules:
          - DAC-P2-001
          - DAC-P2-001a
          - DAC-P2-003
          - DAC-P2-004
          - DAC-P2-005
          - DBR-PUR-004
        flowsTo:
          - sets.library
          - synergy.library
          - catalog.universal

  # ─────────────────────────────────────────────
  - id: build
    label: Build
    description: Build library, create draft, composer tabs, finish, equip/export.
    nodes:
      - id: build.signed-out
        kind: gate
        title: Build — signed-out gate
        path: /build
        auth: signed-out
        rules:
          - BR-AUTH-001
          - DBR-BLD-005

      - id: build.library
        kind: screen
        title: Build library
        path: /build
        auth: signed-in
        rules:
          - DBR-BLD-001
          - DBR-BLD-005
          - BR-BLD-001
          - BR-TAG-006
          - BR-TAG-008
          - BR-VAR-004
          - DAC-NME-002
          - 001:SC-002
        children:
          - id: build.library.list
            kind: surface
            title: Build list
            children:
              - id: build.library.filter.tags
                kind: field
                title: Concept tag filter (AND)
                rules:
                  - BR-TAG-007
                  - BR-TAG-008
                  - BR-TAG-009
                  - DAC-NME-002
                  - DBR-ID-002
              - id: build.library.filter.exotic
                kind: field
                title: Filter by exotic armor / weapon
                rules:
                  - BR-VAR-004
              - id: build.library.search
                kind: field
                title: Search builds by name
              - id: build.library.row
                kind: surface
                title: Build row (name, class, identity hints)
                rules:
                  - DAC-NME-001
                  - DBR-NAME-001
          - id: build.library.new
            kind: field
            title: New Build action
            flowsTo:
              - build.create
          - id: build.library.selected
            kind: subscreen
            title: Selected build summary
            rules:
              - DBR-BLD-001
              - DBR-BLD-003
              - BR-BLD-006
            children:
