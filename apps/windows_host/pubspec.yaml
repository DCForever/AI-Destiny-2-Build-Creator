name: destiny2_windows_host
description: >
  Destiny 2 Build Creator — Flutter Windows host (DART-019…039).
  Opens StorageRoot + single Drift DB; Catalog offline + all/owned; Sets library dual-pane
  (DART-030); Armor optimizer workspace on armor sets — Find kits suggest then explicit confirm
  apply/materialize (DART-036); Synergy library dual-pane + evidence links (DART-031); Builds
  library dual-pane + identity (DART-032) + variant compose / set attachments / slot pins
  (DART-033) + soft coverage chips / soft stat targets display-only (DART-034) + equip UI:
  character pick, equip-ready gate, gaps confirm, step report (DART-038) + DIM jsonOnly
  clipboard export gated on equip-ready (DART-039); Settings + Public+PKCE OAuth + inventory
  sync; Matte Flap Ledger theme. Soft never auto-applies; never silent apply. No CLIENT_SECRET.
publish_to: none
version: 0.0.1+1
resolution: workspace

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  destiny2_app:
    path: ../../packages/app
  destiny2_bungie:
    path: ../../packages/bungie
  destiny2_db:
    path: ../../packages/db
  destiny2_domain:
    path: ../../packages/domain
  destiny2_manifest:
    path: ../../packages/manifest
  destiny2_storage:
    path: ../../packages/storage
  destiny2_ui_tokens:
    path: ../../packages/ui_tokens
  flutter_secure_storage: ^9.2.4
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.28
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
