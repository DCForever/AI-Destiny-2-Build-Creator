name: destiny2_windows_host
description: >
  Destiny 2 Build Creator — Flutter Windows host (DART-019/020).
  Opens StorageRoot + single Drift DB; Catalog offline browse + Settings status.
  No OAuth; no CLIENT_SECRET.
publish_to: none
version: 0.0.1+1
resolution: workspace

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  destiny2_db:
    path: ../../packages/db
  destiny2_manifest:
    path: ../../packages/manifest
  destiny2_storage:
    path: ../../packages/storage
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
